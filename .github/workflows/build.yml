name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Siapkan proyek (otomatis unzip jika yang diunggah file ZIP)
        run: |
          if [ -z "$(find . -maxdepth 3 -name settings.gradle | head -n 1)" ]; then
            Z=$(ls *.zip | head -n 1)
            if [ ! -z "$Z" ]; then
              echo "Membuka berkas ZIP: $Z"
              mkdir -p _src
              unzip -q "$Z" -d _src
            fi
          fi
          S=$(find . -maxdepth 4 -name settings.gradle | head -n 1)
          if [ ! -z "$S" ]; then
            echo "PROJECT_DIR=$(dirname "$S")" >> "$GITHUB_ENV"
            echo "Menemukan direktori proyek di: $(dirname "$S")"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Berikan Izin Eksekusi Gradlew
        run: |
          if [ -f "${{ env.PROJECT_DIR }}/gradlew" ]; then
            chmod +x ${{ env.PROJECT_DIR }}/gradlew
          fi

      - name: Build APK Debug
        run: |
          if [ -f "${{ env.PROJECT_DIR }}/gradlew" ]; then
            cd ${{ env.PROJECT_DIR }}
            ./gradlew assembleDebug --stacktrace
          else
            gradle -p "${{ env.PROJECT_DIR }}" assembleDebug --stacktrace
          fi

      - name: Unggah Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Sholatku-v3-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            
